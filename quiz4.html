            // Förbered frågor (blanda och välj antal)
            questions = [...allQuestions];
            // Blanda
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
            
            // Fyll på om det fattas frågor och välj exakt antal
            const targetCount = 70; 
            while (questions.length < targetCount) {
                questions = questions.concat(allQuestions);
            }
            questions = questions.slice(0, targetCount);

            currentQuestionIndex = 0;
            score = 0;
            restartBtn.classList.add('hidden'); // Göm "Spela igen"-knappen
            showQuestion(); // Visa första frågan
        }

            isLocked = false; // Lås upp så man kan klicka
            startTimer();     // Starta klockan för den nya frågan
            
            // Hämta datan för nuvarande fråga
            let q = questions[currentQuestionIndex];
            
            // Uppdatera texten på skärmen

            questionCounter.innerText = `Fråga ${currentQuestionIndex + 1} av ${questions.length}`;
            scoreDisplay.innerText = `Poäng: ${score}`;

            // Rensa gamla knappar
            answerButtonsElement.innerHTML = '';

            // Skapa en knapp för varje svarsalternativ
            q.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.innerText = answer;
                // Lägg till snygg design på knappen (Tailwind-klasser)
                button.className = 'bg-gray-700 hover:bg-gray-600 text-white font-semibold py-4 px-6 rounded-xl transition border border-gray-600 text-lg';
                
                // Vad händer när man klickar? Kör funktionen selectAnswer

                // Lägg in knappen i rutan
                answerButtonsElement.appendChild(button);
            });
        }

                timerDisplay.innerText = `⏳ ${timeLeft}s`; // Uppdatera texten

                if (timeLeft <= 0) {
                    clearInterval(timer); // Stoppa klockan
                    handleTimeOut();      // Hantera att tiden är ute
                }
            }, 1000);
        }

        function selectAnswer(selectedIndex, button) {
            if (isLocked) return; // Om låst, gör inget (så man inte kan klicka 2 gånger)
            isLocked = true;      // Lås spelet tillfälligt
            clearInterval(timer); // Stoppa klockan eftersom man svarat!

            const correctIndex = questions[currentQuestionIndex].correct;

            // Kolla om det var rätt
            if (selectedIndex === correctIndex) {
                score++; // Öka poängen
                // Ändra färg till GRÖN
                button.classList.remove('bg-gray-700', 'hover:bg-gray-600');
                button.classList.add('bg-green-600', 'border-green-400');
            } else {
                // Ändra färg till RÖD
                button.classList.remove('bg-gray-700', 'hover:bg-gray-600');
                button.classList.add('bg-red-600', 'border-red-400');

                // Visa vilket som var rätt (genom att färga den rätta knappen grön också)
                const allButtons = answerButtonsElement.children;
                allButtons[correctIndex].classList.remove('bg-gray-700');
                allButtons[correctIndex].classList.add('bg-green-600', 'opacity-50');
            }

            // Vänta 1,5 sekund, sen gå till nästa fråga
            setTimeout(nextQuestion, 1500);
        }

        // Gå till nästa fråga
        function nextQuestion() {
            currentQuestionIndex++; // Gå framåt ett steg
            
            // Finns det fler frågor?
            if (currentQuestionIndex < questions.length) {
                showQuestion(); // Visa nästa
            } else {
                showScore(); // Visa resultatet
            }
        }

        // Visa slutresultatet
        function showScore() {
            questionText.innerText = `Du fick ${score} av ${questions.length} poäng!`;
            answerButtonsElement.innerHTML = ''; // Ta bort knapparna
            timerDisplay.innerText = '';         // Dölj timern
            questionCounter.innerText = "Spelet slut";

            // SPARA POÄNG
            const oldScore = localStorage.getItem('quiz4Score') || 0;
            if (score > oldScore) {
                localStorage.setItem('quiz4Score', score);
            }

            // LÄGG TILL I TOTAL POÄNG (Du får poäng varje gång du spelar!)
            let currentTotal = parseInt(localStorage.getItem('totalUserScore') || 0);
            localStorage.setItem('totalUserScore', currentTotal + score);

            // Om man fick ALLA rätt, lås upp nästa nivå (om det finns en nivå 5)
            if (score === questions.length) {
                localStorage.setItem('level4Complete', 'true');
                questionText.innerText += " 🏆 LEGENDARISK! Du klarade Super Svår!";
            }
            checkRankUp(); // Kolla om vi fått en ny rank
            
            // Visa "Spela igen"-knappen
            restartBtn.classList.remove('hidden');
        }

        // Koppla "Spela igen"-knappen till start-funktionen
        restartBtn.addEventListener('click', startGame);

        // Kör igång allt när sidan laddas!
        startGame();

        // Funktion för att kolla om man gått upp i rank
        function checkRankUp() {
            const level1Done = localStorage.getItem('level1Complete') === 'true';
            const level2Done = localStorage.getItem('level2Complete') === 'true';
            const level3Done = localStorage.getItem('level3Complete') === 'true';
            const level4Done = localStorage.getItem('level4Complete') === 'true';
            const level5Done = localStorage.getItem('level5Complete') === 'true';
            const level2Count = parseInt(localStorage.getItem('level2CompletionCount') || 0);
            
            const totalScore = parseInt(localStorage.getItem('totalUserScore') || 0);

            let rank = "Nybörgare";
            if (level1Done) rank = "Nybörgare 1";
            if (totalScore >= 50 && level2Done) rank = "Pro";
            if (totalScore >= 100 && level2Count >= 2) rank = "Pro 1";
            if (totalScore >= 140 && level3Done && level2Count >= 2) rank = "Expert";
            if (totalScore >= 110 && level4Done) rank = "Expert 1";
            if (level1Done && level2Done && level3Done && level4Done && level5Done) rank = "Mästare";

            const oldRank = localStorage.getItem('currentRank') || "Nybörgare";

            if (rank !== oldRank) {
                // SPELA LJUDEFFEKT
                const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3');
                audio.play().catch(e => console.log("Kunde inte spela ljud automatiskt"));
                questionText.innerText += `\n\n🎉 GRATTIS! Du har låst upp en ny rank: ${rank}!`;
                localStorage.setItem('currentRank', rank);
            }
        }

    </script>
<script>
const btn = document.getElementById('mobile-menu-btn');
const menu = document.getElementById('mobile-menu');
btn.addEventListener('click', () => menu.classList.toggle('hidden'));
</script>
