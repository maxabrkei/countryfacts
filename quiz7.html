<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <title>Multiplayer Quiz - Välj Nivå</title>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

    <!-- NAVIGERING - samma som resten av sajten -->
<!-- NAVIGERING - bara "Hem" och "Andra länder" med dropdown -->
<nav class="bg-gradient-to-b from-blue-950 to-gray-900 shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <a href="index.html" class="transition transform hover:scale-105"><img src="faktaomlanderlogo.png" alt="Fakta om Länder" class="h-36"></a>
        
        <!-- HAMBURGER-KNAPP (Syns bara på mobil 'md:hidden') -->
        <!-- Denna knapp togglar menyn när man klickar på den -->
        <button id="mobile-menu-btn" class="md:hidden text-gray-300 hover:text-white focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- DESKTOP-MENY (Gömd på mobil 'hidden', synlig på större skärmar 'md:flex') -->
        <div class="hidden md:flex gap-6 items-center">
            <!-- Hem-länk -->
            <a href="index.html" class="text-white font-semibold">Hem</a>
            <a href="spel.html" class="text-white font-semibold">Spel</a>
            <a href="hemspel2.html" class="text-white font-semibold">Tillbaka</a>
            <!-- Dropdown kan läggas till här om det behövs -->
        </div>
    </div>

    <!-- MOBIL-MENY (Gömd som standard 'hidden') -->
    <!-- Denna div visas när man klickar på hamburger-knappen -->
    <div id="mobile-menu" class="hidden md:hidden bg-gray-900 border-t border-gray-800">
        <div class="px-4 py-2 space-y-1">
            <a href="index.html" class="block py-3 text-white font-semibold hover:bg-gray-800 rounded px-2">Hem</a>
            <a href="spel.html" class="block py-3 text-white font-semibold hover:bg-gray-800 rounded px-2">Spel</a>
            
            <!-- Lista med länder för mobil -->
            <div class="py-2 border-t border-gray-800 mt-2">
                <p class="px-2 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Länder</p>
                <a href="egypt.html" class="block py-2 px-4 text-gray-300 hover:text-white hover:bg-gray-800 rounded">🇪🇬 Egypten</a>
                <a href="sverige.html" class="block py-2 px-4 text-gray-300 hover:text-white hover:bg-gray-800 rounded">🇸🇪 Sverige</a>
                <a href="japan.html" class="block py-2 px-4 text-gray-300 hover:text-white hover:bg-gray-800 rounded">🇯🇵 Japan</a>
                <a href="brasilien.html" class="block py-2 px-4 text-gray-300 hover:text-white hover:bg-gray-800 rounded">🇧🇷 Brasilien</a>
                <a href="italien.html" class="block py-2 px-4 text-gray-300 hover:text-white hover:bg-gray-800 rounded">🇮🇹 Italien</a>
                <a href="usa.html" class="block py-2 px-4 text-gray-300 hover:text-white hover:bg-gray-800 rounded">🇺🇸 USA</a>
                <a href="indien.html" class="block py-2 px-4 text-gray-300 hover:text-white hover:bg-gray-800 rounded">🇮🇳 Indien</a>
                <a href="grekland.html" class="block py-2 px-4 text-gray-300 hover:text-white hover:bg-gray-800 rounded">🇬🇷 Grekland</a>
            </div>
        </div>
    </div>
</nav>

    <!-- HERO - välkomsttext -->
    <header class="text-center py-20 px-4">
        <h1 class="text-4xl md:text-5xl font-bold mb-4">Multiplayer Quiz 👥</h1>
        <p class="text-xl text-gray-400 max-w-2xl mx-auto">
            Välj en svårighetsgrad för att starta ett quiz och tävla mot andra.
        </p>
    </header>

    <!-- NIVÅ-KNAPPAR -->
    <main class="flex-grow flex items-start justify-center p-4">
        <div class="flex flex-col md:flex-row justify-center gap-6">
            
            <!-- LÄTT -->
            <a href="quiz6.html" class="bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-8 rounded-xl transition transform hover:scale-105 shadow-lg flex flex-col items-center w-64">
                <span class="text-2xl">🟢 Lätt</span>
                <span class="text-sm opacity-80">15 Frågor</span>
            </a>

            <!-- MEDEL -->
            <a href="quiz8.html" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-4 px-8 rounded-xl transition transform hover:scale-105 shadow-lg flex flex-col items-center w-64">
                <span class="text-2xl">🟡 Medel</span>
                <span class="text-sm opacity-80">25 Frågor</span>
            </a>

            <!-- SVÅR -->
            <a href="#" class="bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-8 rounded-xl transition transform hover:scale-105 shadow-lg flex flex-col items-center w-64 opacity-75 cursor-not-allowed" title="Kommer snart">
                <span class="text-2xl">🔴 Svår</span>
                <span class="text-sm opacity-80">Kommer snart</span>
            </a>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-950 text-center py-6 text-gray-500 text-sm mt-auto">
        <p>skapad av Max &copy; 2026</p>
    </footer>

    <script>
        // Mobilmeny-script
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        btn.addEventListener('click', () => menu.classList.toggle('hidden'));
    </script>

</body>
</html>
